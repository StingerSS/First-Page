<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>Forest Login Experience</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="REGstyle.css" />
</head>
<body>
    <div id="leaf-container"></div>
    <main class="wrapper">
        <section class="regCard" id="loginCard">
            <h1>Войти</h1>
            <form id="loginForm" novalidate>
                <div class="input-group">
                    <input class="inp" type="email" id="email" placeholder="Почта" required />
                </div>
                <div class="input-group">
                    <input class="inp p" type="password" id="password" placeholder="Пароль" required />
                </div>
                <div class="checkbox-container">
                    <label class="custom-checkbox">
                        <input type="checkbox" id="user-agree" />
                        <span class="checkmark"></span>
                        <span class="label-text">Запомнить меня</span>
                    </label>
                </div>
                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="btn-text">Войти</span>
                    <div class="spinner"></div>
                </button>
            </form>
            <div id="statusMsg"></div>
            <div class="report">
                <p>Нет аккаунта?</p>
                <a href="Register.html">Зарегистрироваться</a>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
