<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>Forest Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="REGstyle.css" />
</head>
<body>
    <div id="leaf-container"></div>
    <main class="wrapper">
        <div class="regCard" id="loginCard">
            <h1>Регистрация</h1>
            
            <!-- ВАЖНО: Добавлена форма для отслеживания отправки -->
            <form id="loginForm">
                <div class="input-group">
                    <input class="inp" type="text" id="username" placeholder="Полное имя" required />
                    <input class="inp" type="email" id="email" placeholder="Почта" required />
                    <!-- Добавлен класс "p" для иконки замочка из вашего CSS -->
                    <input class="inp p" type="password" id="password" placeholder="Создать пароль" required />
                </div>
                
                <!-- Добавлен type="submit" чтобы форма отправлялась -->
                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="btn-text">Создать аккаунт</span>
                    <div class="spinner"></div>
                </button>
            </form>

            <div id="statusMsg"></div>
            <div class="report">
                <p>Уже есть аккаунт?</p>
                <a href="Login.html">Войти</a>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
